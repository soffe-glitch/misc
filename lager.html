<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<script src="auth.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lager</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500&family=Hanken+Grotesk:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#F5F0E8; --surface:#FFFDF9; --surface-2:#F1EBE1; --surface-3:#E7DFD2;
  --ink:#1F2B26; --muted:#66726B; --faint:#9AA39C; --border:#E6DED0;
  --accent:#2F7A62; --accent-soft:#DCEBE3; --accent-ink:#1E5543;
  --amber:#C9822A; --amber-soft:#F6E5CC; --bad:#C4483B; --bad-soft:#F6DEDA;
  --blue:#3B73B5; --blue-soft:#DCE7F4;
  --shadow:0 1px 2px rgba(60,45,20,.04),0 8px 28px rgba(60,45,20,.07);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0E1411; --surface:#161D19; --surface-2:#1C2520; --surface-3:#26312B;
    --ink:#EEF1EA; --muted:#98A89F; --faint:#6E7F76; --border:#25302A;
    --accent:#4FCBA0; --accent-soft:#143027; --accent-ink:#86E3C3;
    --amber:#E5A857; --amber-soft:#35290F; --bad:#E57A68; --bad-soft:#3A1E19;
    --blue:#74A9E6; --blue-soft:#14263D;
    --shadow:0 1px 2px rgba(0,0,0,.25),0 8px 28px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --bg:#0E1411; --surface:#161D19; --surface-2:#1C2520; --surface-3:#26312B;
  --ink:#EEF1EA; --muted:#98A89F; --faint:#6E7F76; --border:#25302A;
  --accent:#4FCBA0; --accent-soft:#143027; --accent-ink:#86E3C3;
  --amber:#E5A857; --amber-soft:#35290F; --bad:#E57A68; --bad-soft:#3A1E19;
  --blue:#74A9E6; --blue-soft:#14263D;
}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
*,*::before,*::after{box-sizing:inherit;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Hanken Grotesk",system-ui,-apple-system,sans-serif;font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:720px;margin:0 auto;padding:22px 16px 90px}
h1,h2{margin:0;font-family:"Fraunces",Georgia,serif;font-weight:400;letter-spacing:-.015em}
a{color:var(--accent-ink)}
.tnum{font-variant-numeric:tabular-nums}
header{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:18px}
header h1{font-size:34px;line-height:1}
header .sub{color:var(--muted);font-size:13.5px;margin-top:6px}
.btn{font:inherit;font-size:14px;font-weight:600;border:1px solid var(--border);background:var(--surface);color:var(--ink);border-radius:999px;padding:8px 14px;cursor:pointer}
.btn:disabled{opacity:.45;cursor:default}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.btn:focus-visible,.q button:focus-visible,.seg button:focus-visible,.item .name:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* indkøbsliste — sidens ene markante element */
.list{background:var(--accent-ink);color:#F4F1E8;border-radius:24px;padding:18px 18px 16px;margin-bottom:22px;box-shadow:var(--shadow)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .list{background:#173126}}
:root[data-theme="dark"] .list{background:#173126}
.list h2{font-size:24px;color:#F4F1E8}
.list .cnt{font-size:13.5px;color:#B5C7BD;margin-top:2px}
.list ul{list-style:none;margin:12px 0 14px;padding:0}
.list li{break-inside:avoid;padding:4px 0;font-size:15px;display:flex;gap:8px;align-items:baseline}
.list li i{width:7px;height:7px;border-radius:50%;flex:none;background:#E5A857;transform:translateY(-1px)}
.list li.zero i{background:#F08A78}
.list li small{color:#B5C7BD}
.list li .nm{flex:1;min-width:0}
.list li button.sk{font:inherit;font-size:12.5px;font-weight:600;background:transparent;color:#B5C7BD;border:1px solid rgba(244,241,232,.25);border-radius:999px;padding:2px 9px;cursor:pointer;flex:none}
.list .hidden-note{font-size:13px;color:#B5C7BD;margin:-6px 0 12px}
.list .hidden-note button{font:inherit;font-size:13px;color:#F4F1E8;background:none;border:0;text-decoration:underline;padding:0;cursor:pointer}
.list ul.skipped li{opacity:.6}
.list .acts{display:flex;gap:8px;flex-wrap:wrap}
.list .btn{background:transparent;color:#F4F1E8;border-color:rgba(244,241,232,.35)}
.list .btn.primary{background:#F4F1E8;color:#1E5543;border-color:#F4F1E8}
.list.empty ul{display:none}

.tabs{display:flex;gap:6px;overflow-x:auto;margin:0 -16px 14px;padding:2px 16px;scrollbar-width:none;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5;padding-bottom:10px}
.tabs::-webkit-scrollbar{display:none}
.tabs button{font:inherit;font-size:14px;font-weight:600;white-space:nowrap;border:1px solid var(--border);background:var(--surface);color:var(--muted);border-radius:999px;padding:7px 13px;cursor:pointer}
.tabs button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tabs button b{font-weight:600;color:var(--amber);margin-left:4px}

section.cat{margin-bottom:22px}
section.cat h2{font-size:21px;margin:0 2px 8px;display:flex;justify-content:space-between;align-items:baseline}
section.cat h2 small{font-family:"Hanken Grotesk",sans-serif;font-size:13px;color:var(--faint);letter-spacing:0}
.items{background:var(--surface);border:1px solid var(--border);border-radius:18px;overflow:hidden}
.item{display:flex;align-items:center;gap:10px;padding:10px 12px 10px 14px;border-top:1px solid var(--border)}
.item:first-child{border-top:0}
.item .name{flex:1;min-width:0;background:none;border:0;padding:0;font:inherit;color:inherit;text-align:left;cursor:pointer}
.item .name > span{display:block;font-weight:500}
.item .name small{display:block;color:var(--faint);font-size:12.5px;line-height:1.35}
.item.low .name > span::after{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--amber);margin-left:7px;transform:translateY(-2px)}
.item.out .name > span::after{background:var(--bad)}
.q{display:flex;align-items:center;gap:2px;flex:none}
.q button{width:36px;height:36px;border-radius:50%;border:1px solid var(--border);background:var(--surface-2);color:var(--ink);font:inherit;font-size:19px;line-height:1;cursor:pointer}
.q button:active{background:var(--surface-3)}
.q output{min-width:38px;text-align:center;font-family:"Fraunces",Georgia,serif;font-size:20px}
.q output small{font-family:"Hanken Grotesk",sans-serif;font-size:11px;color:var(--faint);display:block;line-height:1;margin-top:-2px}
.seg{display:flex;flex:none;border:1px solid var(--border);border-radius:999px;overflow:hidden}
.seg button{font:inherit;font-size:13px;font-weight:600;border:0;background:var(--surface-2);color:var(--muted);padding:7px 10px;cursor:pointer}
.seg button+button{border-left:1px solid var(--border)}
.seg button[aria-pressed="true"].s2{background:var(--accent-soft);color:var(--accent-ink)}
.seg button[aria-pressed="true"].s1{background:var(--amber-soft);color:var(--amber)}
.seg button[aria-pressed="true"].s0{background:var(--bad-soft);color:var(--bad)}
.age{font-size:12px;font-weight:600;border-radius:999px;padding:1px 7px;margin-left:6px}
.age.a1{background:var(--amber-soft);color:var(--amber)}
.age.a2{background:var(--bad-soft);color:var(--bad)}
.soon{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:14px 16px;margin-bottom:22px}
.soon h2{font-size:20px;margin-bottom:6px}
.soon ul{list-style:none;margin:0;padding:0}
.soon li{display:flex;justify-content:space-between;gap:10px;padding:5px 0;border-top:1px solid var(--border);font-size:15px}
.soon li:first-child{border-top:0}
.age.a0{background:var(--accent-soft);color:var(--accent-ink)}
.rcpt{background:var(--surface);border:1px solid var(--amber);border-radius:18px;padding:14px 16px;margin-bottom:22px}
.rcpt h2{font-size:20px}
.rcpt .hint{color:var(--muted);font-size:13.5px;margin:2px 0 8px}
.rl{border-top:1px solid var(--border);padding:10px 0;display:grid;gap:8px}
.rl:first-of-type{border-top:0}
.rl .top{display:flex;justify-content:space-between;gap:8px;font-weight:600}
.rl .top small{font-weight:400;color:var(--faint)}
.rl .ctl{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.rl select,.rl input{width:auto;flex:1;min-width:140px;font-size:15px;padding:7px 10px}
.rl input.fac{flex:0 0 74px;min-width:0}
.rl .lbl{font-size:12.5px;color:var(--muted)}
.empty-cat{padding:16px 14px;color:var(--muted);font-size:14px}

.add{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:14px;display:grid;gap:10px;grid-template-columns:1fr 1fr}
.add h2{grid-column:1/-1;font-size:19px}
label.f{display:grid;gap:4px;font-size:12.5px;color:var(--muted);font-weight:600}
label.f.wide{grid-column:1/-1}
input,select,textarea{font:inherit;font-size:16px;color:var(--ink);background:var(--surface-2);border:1px solid var(--border);border-radius:12px;padding:9px 11px;width:100%}
.add .row{grid-column:1/-1;display:flex;gap:8px;justify-content:flex-end}

dialog{border:0;border-radius:22px;padding:0;background:var(--surface);color:var(--ink);width:min(440px,calc(100vw - 24px));box-shadow:var(--shadow)}
dialog::backdrop{background:rgba(20,25,22,.45)}
dialog form{padding:18px;display:grid;gap:10px;grid-template-columns:1fr 1fr}
dialog h2{grid-column:1/-1;font-size:22px}
dialog .hist{grid-column:1/-1;font-size:13px;color:var(--muted);background:var(--surface-2);border-radius:12px;padding:8px 11px}
dialog .row{grid-column:1/-1;display:flex;gap:8px;justify-content:space-between;margin-top:4px}
.btn.danger{color:var(--bad)}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s;z-index:20}
.toast.on{opacity:1}
.err{background:var(--bad-soft);color:var(--bad);border-radius:14px;padding:12px 14px;margin-bottom:14px;font-size:14px}
@media (max-width:420px){.list ul{columns:1}}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Lager</h1>
      <div class="sub" id="sub">Henter…</div>
    </div>
    <a class="btn" href="index.html">Dashboard</a>
  </header>
  <div id="err"></div>
  <div class="list" id="list"></div>
  <div id="soon"></div>
  <div id="rcpt"></div>
  <nav class="tabs" id="tabs" aria-label="Kategorier"></nav>
  <div id="cats"></div>
  <form class="add" id="addForm" autocomplete="off">
    <h2>Tilføj vare</h2>
    <label class="f wide">Navn<input id="aName" required placeholder="fx Havregryn"></label>
    <label class="f">Kategori<select id="aCat"></select></label>
    <label class="f" id="aQtyWrap">Antal<input id="aQty" type="number" inputmode="decimal" min="0" step="1" value="1"></label>
    <label class="f" id="aUnitWrap">Enhed (valgfri)<input id="aUnit" placeholder="stk, ds, poser"></label>
    <label class="f" id="aExpWrap">Udløber<input id="aExp" type="date"></label>
    <label class="f" id="aDateWrap" hidden>Indfrosset<input id="aDate" type="date"></label>
    <div class="row"><button class="btn primary" type="submit">Tilføj</button></div>
  </form>
</div>

<dialog id="dlg">
  <form method="dialog" id="editForm">
    <h2 id="eTitle">Vare</h2>
    <label class="f wide">Navn<input id="eName" required></label>
    <label class="f">Kategori<select id="eCat"></select></label>
    <label class="f" id="eMinWrap">På listen under<input id="eMin" type="number" inputmode="decimal" min="0" step="1"></label>
    <label class="f" id="eUnitWrap">Enhed<input id="eUnit" placeholder="stk"></label>
    <label class="f" id="eExpWrap">Udløber<input id="eExp" type="date"></label>
    <label class="f" id="eDateWrap">Indfrosset<input id="eDate" type="date"></label>
    <label class="f wide">Note<input id="eNote" placeholder="fx mærke eller hvor den købes"></label>
    <div class="hist" id="eHist"></div>
    <div class="row">
      <button class="btn danger" type="button" id="eDel">Slet</button>
      <span style="display:flex;gap:8px">
        <button class="btn" type="button" id="eCancel">Annullér</button>
        <button class="btn primary" type="submit" id="eSave">Gem</button>
      </span>
    </div>
  </form>
</dialog>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
const SUPABASE_URL="https://kphfvznawqcslkubdsyy.supabase.co";
const SUPABASE_KEY="sb_publishable_7WZMOKUchp-1zkET6-blSA_cVhrj_Lv";
const REST=SUPABASE_URL+"/rest/v1/";
const HEAD={apikey:SUPABASE_KEY,Authorization:"Bearer "+SUPABASE_KEY,"Content-Type":"application/json"};

// mad og tørvarer bruger tre tilstande i stedet for at tælle: 2 = har, 1 = snart tom, 0 = tom
const CATS=[
  {k:"mad",      t:"Køleskab & skab", state:true},
  {k:"torvarer", t:"Tørvarer",        state:true},
  {k:"fryser",   t:"Fryser",          freezer:true},
  {k:"husholdning",t:"Husholdning"},
  {k:"pleje",    t:"Personlig pleje"},
  {k:"medicin",  t:"Medicin"},
];
const CAT=Object.fromEntries(CATS.map(c=>[c.k,c]));
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const todayISO=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");};
const fmtD=iso=>{const [y,m,d]=iso.split("-");return (+d)+"/"+(+m)+(y!==String(new Date().getFullYear())?"-"+y.slice(2):"");};
const daysSince=iso=>Math.round((new Date(todayISO())-new Date(iso))/864e5);

let items=[], filter="alle", lines=[], showSkipped=false;
const snoozed=i=>i.snooze_until&&i.snooze_until>=todayISO();
// dage til udløb; madvarer advarer 3 dage før, alt andet 30 dage før
const daysTo=iso=>Math.round((new Date(iso)-new Date(todayISO()))/864e5);
const warnDays=i=>i.category==="mad"?3:30;
function expBadge(i){
  if(!i.expires||+i.qty===0) return "";
  const d=daysTo(i.expires);
  const txt=d<0?"udløbet "+fmtD(i.expires):d===0?"udløber i dag":d===1?"udløber i morgen":d<=warnDays(i)?"udløber om "+d+" dage":"udløber "+fmtD(i.expires);
  const cls=d<0?"a2":d<=warnDays(i)?"a1":"";
  return cls?`<span class="age ${cls}">${txt}</span>`:txt;
}

async function api(path,opts={}){
  const r=await fetch(REST+path,{...opts,headers:{...HEAD,Prefer:"return=representation",...(opts.headers||{})}});
  if(!r.ok) throw new Error((await r.text())||r.status);
  const t=await r.text(); return t?JSON.parse(t):null;
}
function toast(msg){const t=$("#toast");t.textContent=msg;t.classList.add("on");clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove("on"),1800);}
function showErr(e){$("#err").innerHTML=`<div class="err">Kunne ikke gemme eller hente: ${esc(e.message||e)}. Tjek forbindelsen og prøv igen.</div>`;}

const isLow=i=>+i.qty<+i.min_qty;
const useState=i=>!!(CAT[i.category]?.state&&!i.unit);
const label=i=>useState(i)?(+i.qty>=2?"har":+i.qty===1?"snart tom":"tom"):null;

// hvor længe holder en vare? gennemsnit mellem de datoer den er løbet tør
function lifespan(dates){
  if(!dates||dates.length<2) return null;
  const s=[...dates].sort(); let sum=0;
  for(let i=1;i<s.length;i++) sum+=(new Date(s[i])-new Date(s[i-1]))/864e5;
  const d=Math.round(sum/(s.length-1));
  return d>=60?"holder ca. "+Math.round(d/30)+" mdr.":d>=14?"holder ca. "+Math.round(d/7)+" uger":"holder ca. "+d+" dage";
}

function render(){
  const act=items.filter(i=>i.active);
  // indkøbsliste
  const lowAll=act.filter(isLow).filter(i=>i.category!=="fryser").sort((a,b)=>(+a.qty)-(+b.qty)||a.name.localeCompare(b.name,"da"));
  const low=lowAll.filter(i=>!snoozed(i)), skipped=lowAll.filter(snoozed);
  const L=$("#list");
  L.classList.toggle("empty",!low.length&&!skipped.length);
  L.innerHTML=`<h2>Indkøbsliste</h2>
    <div class="cnt">${low.length?low.length+(low.length===1?" vare mangler eller er ved at slippe op":" varer mangler eller er ved at slippe op"):"Intet mangler lige nu."}</div>
    <ul>${low.map(i=>`<li class="${+i.qty===0?"zero":""}"><i></i><span class="nm">${esc(i.name)} ${+i.qty===0&&i.empty_dates?.length?`<small>tom siden ${fmtD([...i.empty_dates].sort().pop())}</small>`:label(i)==="snart tom"?"<small>snart tom</small>":""}</span><button class="sk" data-skip="${i.id}" aria-label="Spring ${esc(i.name)} over denne gang">Ikke nu</button></li>`).join("")}</ul>
    ${skipped.length?`<div class="hidden-note">${skipped.length} sprunget over denne gang · <button id="togSk">${showSkipped?"Skjul":"Vis"}</button></div>`:""}
    ${skipped.length&&showSkipped?`<ul class="skipped">${skipped.map(i=>`<li><i></i><span class="nm">${esc(i.name)} <small>til ${fmtD(i.snooze_until)}</small></span><button class="sk" data-unskip="${i.id}">På listen igen</button></li>`).join("")}</ul>`:""}
    ${low.length?`<div class="acts"><button class="btn primary" id="shareBtn">Del listen</button><button class="btn" id="copyBtn">Kopiér</button></div>`:""}`;
  L.querySelectorAll("[data-skip]").forEach(b=>b.onclick=()=>skipItem(+b.dataset.skip,true));
  L.querySelectorAll("[data-unskip]").forEach(b=>b.onclick=()=>skipItem(+b.dataset.unskip,false));
  const tg=$("#togSk"); if(tg) tg.onclick=()=>{showSkipped=!showSkipped;render();};
  if(low.length){
    const txt=low.map(i=>i.name).join("\n");
    $("#copyBtn").onclick=async()=>{try{await navigator.clipboard.writeText(txt);toast("Listen er kopieret");}catch(e){toast("Kunne ikke kopiere");}};
    $("#shareBtn").onclick=async()=>{ if(navigator.share){try{await navigator.share({title:"Indkøb",text:txt});}catch(e){}} else $("#copyBtn").click(); };
  }
  // brug snart: udløbet eller inden for advarselsgrænsen
  const soon=act.filter(i=>i.expires&&+i.qty>0&&daysTo(i.expires)<=warnDays(i)).sort((a,b)=>a.expires.localeCompare(b.expires));
  $("#soon").innerHTML=soon.length?`<div class="soon"><h2>Brug snart</h2><ul>${soon.map(i=>`<li><span>${esc(i.name)}</span>${expBadge(i)}</li>`).join("")}</ul></div>`:"";
  // faner
  const lowBy=k=>act.filter(i=>i.category===k&&isLow(i)&&k!=="fryser").length;
  $("#tabs").innerHTML=[`<button data-f="alle" aria-pressed="${filter==="alle"}">Alle</button>`]
    .concat(CATS.map(c=>`<button data-f="${c.k}" aria-pressed="${filter===c.k}">${c.t}${lowBy(c.k)?`<b>${lowBy(c.k)}</b>`:""}</button>`)).join("");
  $("#tabs").querySelectorAll("button").forEach(b=>b.onclick=()=>{filter=b.dataset.f;render();});
  // kategorier
  const show=filter==="alle"?CATS:CATS.filter(c=>c.k===filter);
  $("#cats").innerHTML=show.map(c=>{
    let rows=act.filter(i=>i.category===c.k);
    if(c.freezer) rows.sort((a,b)=>(a.frozen_date||"9999").localeCompare(b.frozen_date||"9999"));
    else rows.sort((a,b)=>a.name.localeCompare(b.name,"da"));
    if(c.freezer) rows=rows.filter(i=>+i.qty>0);
    const sub=c.freezer?(rows.length?"ældste først":""):(rows.length?rows.length+(rows.length===1?" vare":" varer"):"");
    return `<section class="cat" id="c-${c.k}"><h2>${c.t}<small>${sub}</small></h2><div class="items">${
      rows.length?rows.map(row).join(""):`<div class="empty-cat">${c.freezer?"Fryseren er tom. Tilføj det, du lægger i den, nederst på siden.":"Ingen varer endnu. Tilføj dem nederst på siden."}</div>`
    }</div></section>`;
  }).join("");
  $("#cats").querySelectorAll("[data-act]").forEach(b=>b.onclick=()=>act_(b.dataset.act,+b.dataset.id,b.dataset.v));
  $("#cats").querySelectorAll(".name").forEach(b=>b.onclick=()=>openEdit(+b.dataset.id));
  renderRcpt();
  const n=act.filter(i=>i.category!=="fryser").length, f=act.filter(i=>i.category==="fryser"&&+i.qty>0).length;
  $("#sub").textContent=n+" varer i lageret, "+f+" ting i fryseren";
}

function row(i){
  const c=CAT[i.category]; const cls=["item"]; if(isLow(i)&&!c.freezer) cls.push(+i.qty===0?"out":"low");
  const meta=[];
  if(c.freezer&&i.frozen_date){
    const d=daysSince(i.frozen_date), m=d/30;
    meta.push("frosset "+fmtD(i.frozen_date)+(m>=6?`<span class="age a2">${Math.floor(m)} mdr.</span>`:m>=3?`<span class="age a1">${Math.floor(m)} mdr.</span>`:""));
  }
  if(i.expires&&+i.qty>0) meta.push(expBadge(i));
  if(!c.freezer&&+i.qty===0&&i.empty_dates?.length) meta.push("tom siden "+fmtD([...i.empty_dates].sort().pop()));
  const ls=lifespan(i.empty_dates); if(ls&&!useState(i)) meta.push(ls);
  if(i.note) meta.push(esc(i.note));
  const ctrl=useState(i)
    ? `<div class="seg" role="group" aria-label="Status for ${esc(i.name)}">${[[2,"Har"],[1,"Snart"],[0,"Tom"]].map(([v,t])=>`<button class="s${v}" aria-pressed="${+i.qty===v}" data-act="set" data-id="${i.id}" data-v="${v}">${t}</button>`).join("")}</div>`
    : `<div class="q"><button aria-label="Én mindre ${esc(i.name)}" data-act="dec" data-id="${i.id}">−</button><output class="tnum">${+i.qty}${i.unit?`<small>${esc(i.unit)}</small>`:""}</output><button aria-label="Én mere ${esc(i.name)}" data-act="inc" data-id="${i.id}">+</button></div>`;
  return `<div class="${cls.join(" ")}"><button class="name" data-id="${i.id}"><span>${esc(i.name)}</span>${meta.length?`<small>${meta.join(" · ")}</small>`:""}</button>${ctrl}</div>`;
}

// ---- kvitteringslinjer, der ikke er genkendt endnu ----
const titleCase=s=>s.toLowerCase().replace(/(^|[\s/-])(\S)/g,(m,a,b)=>a+b.toUpperCase());
function renderRcpt(){
  const el=$("#rcpt");
  if(!lines.length){el.innerHTML="";return;}
  const opts=CATS.map(c=>{const its=items.filter(i=>i.active&&i.category===c.k).sort((a,b)=>a.name.localeCompare(b.name,"da"));
    return its.length?`<optgroup label="${c.t}">${its.map(i=>`<option value="${i.id}">${esc(i.name)}</option>`).join("")}</optgroup>`:"";}).join("");
  el.innerHTML=`<div class="rcpt"><h2>Fra kvitteringer</h2><div class="hint">Hvilken vare er det? Svaret huskes, så næste gang sker det automatisk.</div>${
    lines.map(l=>`<div class="rl" data-id="${l.id}">
      <div class="top"><span>${esc(l.receipt_name)}</span><small>${+l.qty} stk${l.price!=null?" · "+(+l.price).toFixed(2).replace(".",",")+" kr":""}${l.bought_at?" · "+fmtD(l.bought_at.slice(0,10)):""}</small></div>
      <div class="ctl"><select class="pick"><option value="">Vælg vare…</option><option value="new">＋ Ny vare</option><option value="ignore">Ignorér altid</option>${opts}</select>
        <span class="lbl facw" hidden>antal pr. stk</span><input class="fac facw" type="number" inputmode="decimal" min="1" step="1" value="1" hidden aria-label="Antal pr. stk på kvitteringen"></div>
      <div class="ctl neww" hidden><input class="nn" value="${esc(titleCase(l.receipt_name))}" aria-label="Navn på ny vare"><select class="nc">${catOptions("mad")}</select></div>
      <div class="ctl"><button class="btn primary sv" type="button" disabled>Gem</button></div>
    </div>`).join("")}</div>`;
  el.querySelectorAll(".rl").forEach(r=>{
    const pick=r.querySelector(".pick"), sv=r.querySelector(".sv");
    pick.onchange=()=>{const v=pick.value; sv.disabled=!v;
      r.querySelector(".neww").hidden=v!=="new";
      r.querySelectorAll(".facw").forEach(x=>x.hidden=!(v&&v!=="new"&&v!=="ignore"));};
    sv.onclick=()=>saveLine(+r.dataset.id,r);
  });
}
async function upsertAlias(row){
  await api("lager_alias",{method:"POST",headers:{Prefer:"resolution=merge-duplicates,return=representation"},body:JSON.stringify(row)});
}
async function saveLine(id,r){
  const l=lines.find(x=>x.id===id), v=r.querySelector(".pick").value;
  try{
    if(v==="ignore"){
      await upsertAlias({receipt_name:l.receipt_name,ignore:true,lager_id:null});
      await api("kvittering_linjer?id=eq."+id,{method:"PATCH",body:JSON.stringify({status:"ignored"})});
      toast(l.receipt_name+" ignoreres fremover");
    } else {
      let item, factor=1;
      if(v==="new"){
        const cat=r.querySelector(".nc").value, st=!!CAT[cat].state;
        const body={name:r.querySelector(".nn").value.trim()||titleCase(l.receipt_name),category:cat,qty:st?2:+l.qty,min_qty:st?2:CAT[cat].freezer?0:1};
        [item]=await api("lager",{method:"POST",body:JSON.stringify(body)}); items.push(item);
      } else {
        item=items.find(i=>i.id===+v); factor=Math.max(1,+r.querySelector(".fac").value||1);
        const patch={updated_at:new Date().toISOString(),active:true};
        if(useState(item)) patch.qty=2; else patch.qty=+item.qty+(+l.qty)*factor;
        if(+item.qty===0) patch.expires=null;
        const [u]=await api("lager?id=eq."+item.id,{method:"PATCH",body:JSON.stringify(patch)}); Object.assign(item,u);
      }
      await upsertAlias({receipt_name:l.receipt_name,lager_id:item.id,factor,ignore:false});
      await api("kvittering_linjer?id=eq."+id,{method:"PATCH",body:JSON.stringify({status:"applied",lager_id:item.id})});
      toast(item.name+" er opdateret");
    }
    lines=lines.filter(x=>x.id!==id); render(); $("#err").innerHTML="";
  }catch(e){showErr(e);}
}

// "Ikke nu": væk fra indkøbslisten i 14 dage, eller til varen bliver fyldt op igen
async function skipItem(id,on){
  const i=items.find(x=>x.id===id); if(!i) return;
  const d=new Date(); d.setDate(d.getDate()+14);
  const until=on?d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"):null;
  const prev=i.snooze_until; i.snooze_until=until; render();
  try{ await api("lager?id=eq."+id,{method:"PATCH",body:JSON.stringify({snooze_until:until})}); if(on) toast(i.name+" springes over i 14 dage"); }
  catch(e){ i.snooze_until=prev; render(); showErr(e); }
}

async function act_(kind,id,v){
  const i=items.find(x=>x.id===id); if(!i) return;
  let q=+i.qty;
  if(kind==="inc") q+=1; else if(kind==="dec") q=Math.max(0,q-1); else q=+v;
  if(q===+i.qty) return;
  const patch={qty:q,updated_at:new Date().toISOString()};
  // registrér datoen, når noget løber tør (ikke for fryseren, hvor 0 bare betyder spist)
  if(q===0&&+i.qty>0&&i.category!=="fryser") patch.empty_dates=[...(i.empty_dates||[]),todayISO()];
  if(q===0) patch.expires=null;  // ny pakke får ny dato
  if(q>+i.qty) patch.snooze_until=null;  // fyldt op igen: "ikke nu" gælder ikke længere
  const prev={...i}; Object.assign(i,patch); render();
  try{ await api("lager?id=eq."+id,{method:"PATCH",body:JSON.stringify(patch)}); $("#err").innerHTML=""; }
  catch(e){ Object.assign(i,prev); render(); showErr(e); }
  if(i.category==="fryser"&&q===0) toast(i.name+" er taget op");
}

function catOptions(sel){return CATS.map(c=>`<option value="${c.k}"${c.k===sel?" selected":""}>${c.t}</option>`).join("");}

let editId=null;
function openEdit(id){
  const i=items.find(x=>x.id===id); if(!i) return; editId=id;
  const c=CAT[i.category];
  $("#eTitle").textContent=i.name; $("#eName").value=i.name; $("#eCat").innerHTML=catOptions(i.category);
  $("#eMin").value=+i.min_qty; $("#eUnit").value=i.unit||""; $("#eDate").value=i.frozen_date||""; $("#eNote").value=i.note||""; $("#eExp").value=i.expires||"";
  toggleEditFields(i.category);
  const ds=[...(i.empty_dates||[])].sort();
  $("#eHist").innerHTML=ds.length?`Løbet tør: ${ds.map(fmtD).join(", ")}${lifespan(ds)?" — "+lifespan(ds):""}`:"Ingen historik endnu. Datoen gemmes automatisk, når varen rammer 0.";
  $("#dlg").showModal();
}
function toggleEditFields(cat){
  const c=CAT[cat], hasUnit=!!$("#eUnit").value.trim();
  $("#eMinWrap").hidden=!!((c.state&&!hasUnit)||c.freezer); $("#eDateWrap").hidden=!c.freezer; $("#eUnitWrap").hidden=false;
}
$("#eUnit").oninput=()=>toggleEditFields($("#eCat").value);
$("#eCat").onchange=e=>toggleEditFields(e.target.value);
$("#eCancel").onclick=()=>$("#dlg").close();
$("#editForm").onsubmit=async e=>{
  e.preventDefault();
  const i=items.find(x=>x.id===editId); const cat=$("#eCat").value, c=CAT[cat];
  const patch={name:$("#eName").value.trim(),category:cat,unit:$("#eUnit").value.trim()||null,note:$("#eNote").value.trim()||null,
    frozen_date:c.freezer?($("#eDate").value||null):null,expires:$("#eExp").value||null,updated_at:new Date().toISOString()};
  const willState=c.state&&!patch.unit, wasState=useState(i);
  if(willState){patch.min_qty=2; if(!wasState) patch.qty=+i.qty>0?2:0;}
  else if(!c.freezer){patch.min_qty=Math.max(0,+$("#eMin").value||0); if(wasState) patch.qty=+i.qty>0?1:0;}
  try{ const [r]=await api("lager?id=eq."+editId,{method:"PATCH",body:JSON.stringify(patch)}); Object.assign(i,r); $("#dlg").close(); render(); toast("Gemt"); }
  catch(err){ showErr(err); }
};
$("#eDel").onclick=async()=>{
  const i=items.find(x=>x.id===editId); if(!confirm("Slet "+i.name+" fra lageret?")) return;
  try{ await api("lager?id=eq."+editId,{method:"DELETE"}); items=items.filter(x=>x.id!==editId); $("#dlg").close(); render(); toast("Slettet"); }
  catch(err){ showErr(err); }
};

// tilføj
$("#aCat").innerHTML=catOptions("mad");
function toggleAdd(){
  const c=CAT[$("#aCat").value];
  const hasUnit=!!$("#aUnit").value.trim();
  $("#aQtyWrap").hidden=!!(c.state&&!hasUnit); $("#aUnitWrap").hidden=false; $("#aDateWrap").hidden=!c.freezer;
  if(c.freezer&&!$("#aDate").value) $("#aDate").value=todayISO();
}
$("#aCat").onchange=toggleAdd; $("#aUnit").oninput=toggleAdd; toggleAdd();
$("#addForm").onsubmit=async e=>{
  e.preventDefault();
  const cat=$("#aCat").value, c=CAT[cat];
  const body={name:$("#aName").value.trim(),category:cat,
    unit:$("#aUnit").value.trim()||null};
  const st=c.state&&!body.unit;
  Object.assign(body,{qty:st?2:Math.max(0,+$("#aQty").value||0), min_qty:st?2:c.freezer?0:1, frozen_date:c.freezer?($("#aDate").value||todayISO()):null, expires:$("#aExp").value||null});
  if(!body.name) return;
  try{ const [r]=await api("lager",{method:"POST",body:JSON.stringify(body)}); items.push(r); $("#aName").value=""; $("#aQty").value=1; $("#aUnit").value=""; $("#aExp").value="";
    filter=cat; render(); toast(body.name+" er tilføjet"); document.getElementById("c-"+cat)?.scrollIntoView({behavior:matchMedia("(prefers-reduced-motion:reduce)").matches?"auto":"smooth"}); }
  catch(err){ showErr(err); }
};

(async()=>{
  try{ [items,lines]=await Promise.all([api("lager?select=*&order=name"),api("kvittering_linjer?status=eq.pending&order=bought_at")]); render(); }
  catch(e){ $("#sub").textContent=""; showErr(e); }
})();
</script>
</body>
