<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<script src="auth.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Projekt Vægttab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Hanken+Grotesk:wght@400;500;600;700&display=swap">
<style>
/* Samme designsprog som livsstil-dashboardet: varm papir/skov-palette, serif-tal, bløde runde kort */
:root{
  --bg:#F5F0E8; --surface:#FFFDF9; --surface-2:#F1EBE1; --surface-3:#E7DFD2;
  --ink:#1F2B26; --muted:#66726B; --faint:#9AA39C; --border:#E6DED0;
  --accent:#2F7A62; --accent-soft:#DCEBE3; --accent-ink:#1E5543;
  --hero:#1F3B31; --hero-ink:#F4F1E8; --hero-muted:#B5C7BD;
  --amber:#C9822A; --amber-soft:#F6E5CC;
  --blue:#3B73B5; --blue-soft:#DCE7F4;
  --good:#2F7A62; --warn:#C9822A; --bad:#C4483B;
  --grid:#ECE5D8; --shadow:0 1px 2px rgba(60,45,20,.04),0 8px 28px rgba(60,45,20,.07);
  --r:22px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0E1411; --surface:#161D19; --surface-2:#1C2520; --surface-3:#26312B;
    --ink:#EEF1EA; --muted:#98A89F; --faint:#6E7F76; --border:#25302A;
    --accent:#4FCBA0; --accent-soft:#143027; --accent-ink:#86E3C3;
    --hero:#173126; --hero-ink:#F1F4EC; --hero-muted:#9DB8AA;
    --amber:#E5A857; --amber-soft:#35290F;
    --blue:#74A9E6; --blue-soft:#14263D;
    --good:#4FCBA0; --warn:#E5A857; --bad:#E57A68;
    --grid:#222C26; --shadow:0 1px 2px rgba(0,0,0,.25),0 8px 28px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --bg:#0E1411; --surface:#161D19; --surface-2:#1C2520; --surface-3:#26312B;
  --ink:#EEF1EA; --muted:#98A89F; --faint:#6E7F76; --border:#25302A;
  --accent:#4FCBA0; --accent-soft:#143027; --accent-ink:#86E3C3;
  --hero:#173126; --hero-ink:#F1F4EC; --hero-muted:#9DB8AA;
  --amber:#E5A857; --amber-soft:#35290F;
  --blue:#74A9E6; --blue-soft:#14263D;
  --good:#4FCBA0; --warn:#E5A857; --bad:#E57A68;
  --grid:#222C26; --shadow:0 1px 2px rgba(0,0,0,.25),0 8px 28px rgba(0,0,0,.35);
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:"Hanken Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:15px; line-height:1.5; -webkit-font-smoothing:antialiased; overflow-x:hidden;
}
.wrap{max-width:1120px; margin:0 auto; padding:24px 16px 80px}
.tnum{font-variant-numeric:tabular-nums}
h1,h2,h3{margin:0; font-family:"Fraunces",Georgia,serif; font-weight:500; letter-spacing:-.015em}
a{color:var(--accent-ink)}

header.top{display:flex; align-items:flex-end; justify-content:space-between; gap:16px; flex-wrap:wrap; margin-bottom:20px}
.brand .eyebrow{font-size:11.5px; letter-spacing:.16em; text-transform:uppercase; color:var(--accent); font-weight:700; margin-bottom:3px}
.brand h1{font-size:32px; line-height:1.03; font-weight:400}
.top-actions{display:flex; gap:8px; align-items:center}
.theme-btn{background:var(--surface); border:1px solid var(--border); color:var(--muted); width:40px; height:40px; border-radius:99px; cursor:pointer; font-size:16px; display:grid; place-items:center}
.theme-btn:hover{color:var(--ink)}
.status-line{display:flex; gap:10px; align-items:center; flex-wrap:wrap; font-size:13.5px; color:var(--muted); margin-top:6px}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block}

/* hero: mørk skovflade med store tal */
.hero{
  --ink:var(--hero-ink); --muted:var(--hero-muted); --surface-3:rgba(255,255,255,.16); --border:rgba(255,255,255,.14);
  --good:#8FE3C3; --bad:#FFA999; --accent:#8FE3C3; --accent-ink:#BFE8D6;
  position:relative; overflow:hidden; color:var(--hero-ink);
  background:radial-gradient(120% 140% at 0% 0%,color-mix(in srgb,var(--hero) 80%,#4FCBA0) 0%,var(--hero) 62%);
  border-radius:28px; padding:26px; box-shadow:var(--shadow); margin-bottom:14px;
  display:grid; grid-template-columns:1fr 1.15fr; gap:0; align-items:stretch}
.hero::after{content:""; position:absolute; right:-70px; top:-70px; width:220px; height:220px; border-radius:50%; background:rgba(255,255,255,.05); pointer-events:none}
.hero-now{padding-right:26px; display:flex; flex-direction:column; justify-content:center; position:relative}
.hero-action{padding-left:26px; border-left:1px solid var(--border); display:flex; flex-direction:column; justify-content:center; position:relative}
.lbl{font-size:11.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); font-weight:700}
.hero-now .big{font-family:"Fraunces",serif; font-size:68px; line-height:.95; font-weight:400; margin:10px 0 4px; letter-spacing:-.03em}
.hero-now .big span{font-size:24px; color:var(--muted); font-family:"Hanken Grotesk",sans-serif; font-weight:500; letter-spacing:0}
.hero-now .delta{font-size:15px; font-weight:700}
.progress-wrap{margin-top:18px}
.progress-head{display:flex; justify-content:space-between; font-size:12.5px; color:var(--muted); margin-bottom:7px}
.bar{height:12px; border-radius:99px; background:var(--surface-3); overflow:hidden; position:relative}
.bar > i{display:block; height:100%; border-radius:99px; background:linear-gradient(90deg,var(--accent),var(--accent-ink)); transition:width .6s cubic-bezier(.2,.7,.2,1)}
.bar .goalmark{position:absolute; top:0; height:12px; width:2px; background:var(--ink); opacity:.55}

.action-big{font-family:"Fraunces",serif; font-size:56px; line-height:1; font-weight:400; letter-spacing:-.03em; margin:8px 0 4px}
.action-big span{font-size:22px; font-weight:500; font-family:"Hanken Grotesk",sans-serif; color:var(--muted); letter-spacing:0}
.action-sub{font-size:14px; color:var(--muted); margin-top:2px}
.action-meta{display:flex; gap:20px; margin-top:18px; flex-wrap:wrap}
.action-meta .m .k{font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.07em; font-weight:700}
.action-meta .m .v{font-size:17px; font-weight:600; margin-top:2px}
.pill{display:inline-flex; align-items:center; gap:6px; font-size:12.5px; font-weight:600; padding:3px 11px; border-radius:99px; background:var(--surface-2)}

/* stat tiles */
.stats{display:grid; gap:12px; margin-bottom:14px}
.stats3{grid-template-columns:repeat(3,1fr)}
.stats4{grid-template-columns:repeat(4,1fr)}
.tile{background:var(--surface); border:1px solid var(--border); border-radius:20px; padding:16px; box-shadow:var(--shadow); min-width:0}
.tile .k{font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.07em; font-weight:700; display:flex; align-items:center; gap:5px}
.tile .v{font-size:30px; font-weight:400; font-family:"Fraunces",serif; margin-top:8px; letter-spacing:-.02em; line-height:1}
.tile .v small{font-size:12.5px; color:var(--muted); font-family:"Hanken Grotesk",sans-serif; font-weight:500; letter-spacing:0}
.tile .sub{font-size:11.5px; color:var(--muted); margin-top:5px}
.tile.on-good{border-color:color-mix(in srgb,var(--good) 40%,var(--border))}
.tile .meter{height:7px; border-radius:99px; background:var(--surface-3); overflow:hidden; margin-top:10px}
.tile .meter > i{display:block; height:100%; border-radius:99px}

/* cards */
.cards{display:grid; gap:14px; margin-bottom:14px}
.cards.c2a{grid-template-columns:1.5fr 1fr}
.cards.c2b{grid-template-columns:1.5fr 1fr}
.card{background:var(--surface); border:1px solid var(--border); border-radius:var(--r); padding:22px; box-shadow:var(--shadow); min-width:0}
.card > .ch{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:14px; gap:10px}
.card h2{font-size:20px}
.card .hint{font-size:12.5px; color:var(--muted)}
.legend{display:flex; gap:14px; flex-wrap:wrap; font-size:12px; color:var(--muted); margin-top:12px}
.plan{margin-top:14px; padding-top:12px; border-top:1px solid var(--border); font-size:14px; line-height:1.6; display:grid; gap:8px}
.plan b{font-weight:600}
.legend i{display:inline-block; width:18px; height:3px; border-radius:2px; vertical-align:middle; margin-right:5px}
.legend i.dash{background:repeating-linear-gradient(90deg,currentColor 0 5px,transparent 5px 9px); height:2px}

.dual{display:grid; grid-template-columns:1fr 1fr; gap:18px}
.dual h3{font-size:15px; margin-bottom:4px}
.dual .cap{font-size:12px; color:var(--muted); margin-bottom:6px}

.mini-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px}
.mini{background:var(--surface-2); border-radius:16px; padding:14px 15px}
.mini .k{font-size:11px; text-transform:uppercase; letter-spacing:.07em; color:var(--muted); font-weight:700}
.mini .v{font-size:28px; font-weight:400; font-family:"Fraunces",serif; margin-top:4px; letter-spacing:-.02em}
.mini .v small{font-size:12.5px; color:var(--muted); font-family:"Hanken Grotesk",sans-serif; font-weight:500}
.sync-btn{border:1px solid var(--border); background:var(--surface-2); color:var(--muted); font:inherit; font-size:12px; font-weight:600; padding:6px 13px; border-radius:99px; cursor:pointer}
.sync-btn:hover{color:var(--ink)}
.sync-btn:disabled{opacity:.6; cursor:default}

/* forms */
.tabs{display:flex; gap:4px; background:var(--surface-2); padding:4px; border-radius:99px; margin-bottom:16px}
.tabs button{flex:1; border:0; background:transparent; padding:9px 10px; border-radius:99px; cursor:pointer; font:inherit; font-weight:600; font-size:13.5px; color:var(--muted); transition:background .15s,color .15s}
.tabs button.on{background:var(--surface); color:var(--ink); box-shadow:var(--shadow)}
.field{margin-bottom:12px}
.field label{display:block; font-size:11px; font-weight:700; color:var(--muted); margin-bottom:6px; text-transform:uppercase; letter-spacing:.06em}
.field input, .field select, .field textarea{
  width:100%; padding:12px 14px; border-radius:14px; border:1.5px solid var(--border);
  background:var(--surface-2); color:var(--ink); font:inherit; font-size:16px}
.field input:focus, .field select:focus, .field textarea:focus{outline:0; border-color:var(--accent)}
.row2{display:grid; grid-template-columns:1fr 1fr; gap:12px}
.btn{width:100%; padding:13px; border-radius:14px; border:0; background:var(--accent); color:#fff; font:inherit; font-weight:700; font-size:15px; cursor:pointer; margin-top:4px; transition:transform .1s,filter .15s}
.btn:hover{filter:brightness(1.06)} .btn:active{transform:scale(.985)}
.btn:disabled{opacity:.55; cursor:default}
:root[data-theme="dark"] .btn{color:#07130e}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn{color:#07130e}}
.form-note{font-size:12.5px; color:var(--muted); margin-top:10px; min-height:18px}
.form-note.ok{color:var(--good); font-weight:600}
.form-note.err{color:var(--bad); font-weight:600}
.budget-live{background:var(--accent-soft); color:var(--accent-ink); border-radius:14px; padding:12px 14px; font-size:13px; font-weight:600; margin-bottom:12px}

.log-list{display:flex; flex-direction:column; gap:2px; max-height:360px; overflow-y:auto; margin:-4px -6px; padding:4px 6px}
.log-row{display:grid; grid-template-columns:72px 1fr; gap:10px; align-items:center; padding:10px 8px; border-bottom:1px solid var(--border)}
.log-row:last-child{border-bottom:0}
.log-row:hover{background:var(--surface-2); border-radius:12px}
.log-row .d{font-size:12.5px; color:var(--muted); font-weight:600}
.log-row .m{font-size:14px}
.log-row .m b{font-weight:600}
.chip{display:inline-block; font-size:11px; font-weight:700; padding:3px 9px; border-radius:99px; letter-spacing:.02em}
.chip.w{background:var(--accent-soft); color:var(--accent-ink)}
.chip.c{background:var(--amber-soft); color:var(--amber)}
.chip.t{background:var(--blue-soft); color:var(--blue)}

.tt{position:fixed; pointer-events:none; z-index:20; background:var(--ink); color:var(--bg); padding:7px 10px; border-radius:8px; font-size:12.5px; line-height:1.35; box-shadow:0 6px 20px rgba(0,0,0,.25); opacity:0; transition:opacity .1s; white-space:nowrap}
svg{display:block; width:100%; height:auto; overflow:visible}
.axis-t{font-size:10.5px; fill:var(--faint); font-family:"Hanken Grotesk",sans-serif}

.loading{text-align:center; color:var(--muted); padding:60px 0}
.err-banner{background:var(--amber-soft); color:var(--amber); border:1px solid var(--amber); border-radius:12px; padding:14px 16px; font-size:13.5px; margin-bottom:16px; display:none}
footer{margin-top:30px; text-align:center; color:var(--faint); font-size:12px}

@media (max-width:900px){
  .stats4{grid-template-columns:repeat(2,1fr)}
  .cards.c2a,.cards.c2b{grid-template-columns:1fr}
}
@media (max-width:720px){
  .wrap{padding:16px 14px 70px}
  header.top{flex-wrap:nowrap; align-items:flex-start}
  .brand{flex:1; min-width:0}
  .brand h1{font-size:28px}
  .hero{grid-template-columns:1fr; padding:22px; border-radius:26px}
  .hero-now{padding-right:0; padding-bottom:20px; border-bottom:1px solid var(--border)}
  .hero-action{padding-left:0; padding-top:20px; border-left:0}
  .hero-now .big{font-size:60px}
  .action-big{font-size:50px}
  .action-meta{gap:14px 22px}
  .stats3,.stats4{grid-template-columns:repeat(2,1fr)}
  .tile .v{font-size:26px}
  .card{padding:18px}
  .dual,.row2{grid-template-columns:1fr}
  .row2{grid-template-columns:1fr 1fr}
}
/* Indlejret som fane i livsstil-dashboardet: skjul egen header/footer (forsiden har dem) */
body.embed .top{display:none}
body.embed footer{display:none}
body.embed .wrap{padding:8px 4px 28px;max-width:none}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <div class="eyebrow">Projekt Vægttab · kaloriestyret</div>
      <h1>Sofies dashboard</h1>
      <div class="status-line" id="statusLine"><span class="dot" style="background:var(--faint)"></span> Forbinder…</div>
    </div>
    <div class="top-actions"><button class="theme-btn" id="themeBtn" title="Skift tema" aria-label="Skift tema">◐</button></div>
  </header>

  <div class="err-banner" id="errBanner"></div>
  <div id="app"><div class="loading">Henter dine data…</div></div>
  <footer>Data gemmes i din egen Supabase-database</footer>
</div>
<div class="tt" id="tooltip"></div>

<script>
const SUPABASE_URL="https://kphfvznawqcslkubdsyy.supabase.co";
const SUPABASE_KEY="sb_publishable_7WZMOKUchp-1zkET6-blSA_cVhrj_Lv";
const REST=SUPABASE_URL+"/rest/v1/";
const FN_URL=SUPABASE_URL+"/functions/v1/sync-intervals";
const FN_WEIGH=SUPABASE_URL+"/functions/v1/sync-withings";
const HEAD={apikey:SUPABASE_KEY,Authorization:"Bearer "+SUPABASE_KEY,"Content-Type":"application/json"};
let syncStatus="man–søn"; let bgSynced=false;

const $=s=>document.querySelector(s);
const pad=n=>String(n).padStart(2,"0");
const todayISO=()=>{const d=new Date();return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());};
const parseD=s=>{const[y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d);};
const daysBetween=(a,b)=>Math.round((parseD(b)-parseD(a))/86400000);
const addDays=(iso,n)=>{const d=parseD(iso);d.setDate(d.getDate()+n);return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());};
const MONTHS=["jan","feb","mar","apr","maj","jun","jul","aug","sep","okt","nov","dec"];
const fmtD=s=>{const d=parseD(s);return d.getDate()+". "+MONTHS[d.getMonth()];};
const num=(n,dec=1)=>Number(n).toLocaleString("da-DK",{minimumFractionDigits:dec,maximumFractionDigits:dec});
const kg=n=>num(n,1)+" kg";
const gram=n=>Math.round(n).toLocaleString("da-DK")+" g";
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

async function apiGet(t,qs=""){const P=/[?&]limit=/.test(qs)?0:1000,U=REST+t+qs+(qs?"&":"?");let all=[];for(let o=0;;o+=P){const r=await fetch(P?U+"limit="+P+"&offset="+o:REST+t+qs,{headers:HEAD});if(!r.ok)throw new Error(t+": "+r.status+" "+(await r.text()));const j=await r.json();all=all.concat(j);if(!P||j.length<P)return all;}}

let S={settings:null,weighins:[],nutrition:[],workouts:[],garmin:[]};

async function loadAll(){
  const [settings,weighins,nutrition,workouts]=await Promise.all([
    apiGet("settings","?select=*&limit=1"),
    apiGet("weighins","?select=*&order=log_date.asc,moment.asc"),
    apiGet("nutrition","?select=*&order=log_date.asc"),
    apiGet("workouts","?select=*&order=log_date.desc")
  ]);
  S.settings=settings[0];
  // vægttabs-dashboardet er afgrænset til kurperioden (livsstil-dashboardet viser fuld historik)
  const kurStart=settings[0].kur_start_date;
  S.weighins=weighins.filter(w=>w.log_date>=kurStart).map(w=>({...w,weight_kg:+w.weight_kg}));
  S.nutrition=nutrition.map(n=>({...n,calories_in:n.calories_in==null?null:+n.calories_in,grams:n.grams==null?null:+n.grams}));
  S.workouts=workouts.map(w=>({...w,distance_km:w.distance_km==null?null:+w.distance_km}));
  try{ S.garmin=(await apiGet("garmin_daily","?select=log_date,kcal_total,kcal_active,kcal_bmr,last_sync:raw->stats->>lastSyncTimestampGMT&order=log_date.asc&log_date=gte."+addDays(todayISO(),-35)))
        .map(g=>({log_date:g.log_date,kt:g.kcal_total==null?null:+g.kcal_total,ka:g.kcal_active==null?null:+g.kcal_active,kb:g.kcal_bmr==null?null:+g.kcal_bmr,ls:g.last_sync?new Date(g.last_sync+"Z"):null})); }
  catch(e){ S.garmin=[]; }
  try{ const ga=await apiGet("garmin_activities","?select=calories&log_date=eq."+todayISO()); S.gactsKcalToday=ga.reduce((a,x)=>a+(+x.calories||0),0); }
  catch(e){ S.gactsKcalToday=0; }
}

// ---- Matematikkur math ----
// målvægt-linje fra (startdato, startvægt) til (slutdato, slutvægt)
function malvaegt(iso,endW){
  const s=S.settings;
  // justeret linje (fx rygestop): starter forfra fra (dato, vægt) og slutter stadig på målvægten på slutdatoen
  if(s.line_adj_date&&s.line_adj_weight!=null&&iso>=s.line_adj_date){
    const spanDays=Math.max(1,daysBetween(s.line_adj_date,s.kur_end_date));
    const d=Math.max(0,Math.min(spanDays,daysBetween(s.line_adj_date,iso)));
    return +s.line_adj_weight-((+s.line_adj_weight-endW)/spanDays)*d;
  }
  const totalDays=daysBetween(s.kur_start_date,s.kur_end_date)+1; // antal kurdage inkl. begge dage (100)
  let dayNum=daysBetween(s.kur_start_date,iso)+1;                 // dag 1 = kur-start (allerede ét dagstab under start)
  dayNum=Math.max(1,Math.min(totalDays,dayNum));
  return s.start_weight-((s.start_weight-endW)/totalDays)*dayNum;
}
const MOMENTS={morgen:"Morgen",foraften:"Før aftensmad",sengetid:"Sengetid"};
function morningSeries(){const ks=S.settings.kur_start_date;return S.weighins.filter(w=>w.moment==="morgen"&&w.log_date>=ks).sort((a,b)=>a.log_date<b.log_date?-1:1);}
function weighToday(moment){const t=todayISO();return S.weighins.find(w=>w.log_date===t&&w.moment===moment);}
function sumDay(arr,iso,key){return arr.filter(x=>x.log_date===iso).reduce((a,x)=>a+(x[key]||0),0);}

function stats(){
  const s=S.settings, M=morningSeries();
  const latest=M.length?M[M.length-1]:{log_date:s.kur_start_date,weight_kg:s.start_weight};
  const cur=latest.weight_kg;
  const lost=s.start_weight-cur;
  const target=malvaegt(latest.log_date,s.kur_basis_weight);
  const vsPlan=target-cur; // + = foran (under linjen)
  const daysLeft=Math.max(0,daysBetween(todayISO(),s.kur_end_date));
  const span=s.start_weight-s.kur_basis_weight;
  const pct=Math.max(0,Math.min(100,(lost/span)*100));
  let rate=null;
  if(M.length>=2){
    // tempo = regressionslinjens haeldning over kurens morgenvejninger (robust mod enkelte stoejdage)
    const d0=parseD(M[0].log_date).getTime();
    const xs=M.map(w=>(parseD(w.log_date).getTime()-d0)/86400000), ys=M.map(w=>w.weight_kg);
    const n=xs.length, sx=xs.reduce((a,b)=>a+b,0), sy=ys.reduce((a,b)=>a+b,0);
    const sxy=xs.reduce((a,x,i)=>a+x*ys[i],0), sxx=xs.reduce((a,x)=>a+x*x,0);
    const den=n*sxx-sx*sx;
    if(den>0) rate=-((n*sxy-sx*sy)/den)*7; // + = vaegttab pr uge
  }
  let projReal=null,projGoal=null;
  if(rate&&rate>0.02){
    projReal=addDays(latest.log_date,Math.round((cur-s.kur_basis_weight)/rate*7));
    projGoal=addDays(latest.log_date,Math.round((cur-s.goal_weight)/rate*7));
  }
  return {cur,lost,target,vsPlan,daysLeft,pct,rate,latest,projReal,projGoal};
}

// ---- Trend og tempo: enkeltvejninger svinger ±0,5 kg (vand, ugedag) — trenden er det, der tæller ----
function trendSeries(){ // 7-dages gennemsnit af morgenvægt (kræver mindst 3 vejninger i vinduet)
  const M=morningSeries();
  return M.map(d=>{const t=parseD(d.log_date).getTime();
    const win=M.filter(x=>{const dt=(t-parseD(x.log_date).getTime())/86400000;return dt>=0&&dt<7;});
    return win.length>=3?win.reduce((a,x)=>a+x.weight_kg,0)/win.length:null;});
}
function rateOver(days){ // kg/uge tabt (+ = tab, − = stigning): regressionslinje over seneste N dage af morgenvejninger
  const M=morningSeries(); if(!M.length) return null;
  const last=parseD(M[M.length-1].log_date).getTime();
  const P=M.filter(w=>(last-parseD(w.log_date).getTime())/86400000<days); if(P.length<Math.min(8,Math.round(days/3))) return null;
  const d0=parseD(P[0].log_date).getTime(), xs=P.map(w=>(parseD(w.log_date).getTime()-d0)/86400000), ys=P.map(w=>w.weight_kg);
  const n=xs.length, sx=xs.reduce((a,b)=>a+b,0), sy=ys.reduce((a,b)=>a+b,0), sxy=xs.reduce((a,x,i)=>a+x*ys[i],0), sxx=xs.reduce((a,x)=>a+x*x,0), den=n*sxx-sx*sx;
  return den>0?-((n*sxy-sx*sy)/den)*7:null;
}

// ---- Dagsbudget = dagens (skønnede) forbrug − ønsket underskud (settings.daily_deficit, std. 300) ----
// Forbrug i dag = Garmins hvileforbrug for et helt døgn (snit af seneste 7 dage)
//   + max(dit normale aktive forbrug [snit 28 dage], dagens aktive forbrug [Garmin-stats / aktiviteter / løbe-km×66])
//   + korrektion (settings.garmin_kcal_correction, std. −250).
// Så er budgettet "en almindelig dag" om morgenen og vokser, når du træner.
function dayBudget(){
  const s=S.settings||{}, t=todayISO();
  const corr=(s.garmin_kcal_correction==null)?-250:+s.garmin_kcal_correction;
  const deficit=(s.daily_deficit==null)?300:+s.daily_deficit;
  const G=(S.garmin||[]).filter(g=>g.kt!=null);
  const past=G.filter(g=>g.log_date<t);
  const bmrs=past.filter(g=>g.kb!=null&&g.kb>1000).slice(-7).map(g=>g.kb);
  const acts=past.filter(g=>g.ka!=null&&g.log_date>=addDays(t,-28)).map(g=>g.ka);
  const mean=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:null;
  const bmrFull=mean(bmrs), typAct=mean(acts);
  if(bmrFull==null){ const tg=+s.calorie_target||1600; return {ok:false,budget:tg,burn:tg+deficit,deficit,src:"fast dagsmål (ingen Garmin-data)"}; }
  const gT=G.find(g=>g.log_date===t);
  const statAct=gT&&gT.ka!=null?gT.ka:0;
  const actKcal=(S.gactsKcalToday||0);
  const runKm=(S.workouts||[]).filter(w=>w.log_date===t&&w.kind==="loeb").reduce((a,w)=>a+(+w.distance_km||0),0);
  const actToday=Math.max(statAct, actKcal>0?actKcal:runKm*66);  // Garmins aktivitets-kcal når de findes, ellers løbe-km×66
  const usedAct=Math.max(typAct||0, actToday);
  const burn=Math.round(bmrFull+usedAct+corr);
  const src=actToday>(typAct||0)?(actToday===actKcal&&actKcal>0?"Garmin-aktiviteter i dag":actToday===statAct?"Garmin i dag":"løbe-km i dag"):"normal dag";
  return {ok:true,budget:burn-deficit,burn,deficit,corr,bmrFull:Math.round(bmrFull),typAct:Math.round(typAct||0),actToday:Math.round(actToday),src};
}
// ---- Energibalance: Garmins forbrug (korrigeret med settings.garmin_kcal_correction, std. −250) minus logget indtag ----
// Positiv = underskud. Dage uden madlog tæller ikke som underskud. I dag vises først efter Garmin-synk kl. 20.
function ebData(){
  const s=S.settings||{}; const corr=(s.garmin_kcal_correction==null)?-250:+s.garmin_kcal_correction;
  const t=todayISO();
  const kmap={}; S.nutrition.forEach(n=>{kmap[n.log_date]=(kmap[n.log_date]||0)+(n.calories_in||0);});
  const gmap={}; (S.garmin||[]).forEach(g=>{gmap[g.log_date]=g;});
  const prevB=(S.garmin||[]).filter(g=>g.log_date<t&&g.kb!=null&&g.kb>1000).slice(-7).map(g=>g.kb);
  const bmrFull=prevB.length?prevB.reduce((a,b)=>a+b,0)/prevB.length:null;
  const days=[]; for(let i=13;i>=0;i--) days.push(addDays(t,-i));
  const pts=days.map(d=>{
    const g=gmap[d]; const eat=Math.round(kmap[d]||0); let burn=null, prelim=false;
    if(g&&g.kt!=null){
      if(d===t){ const B=dayBudget(); if(B.ok){ prelim=true; burn=B.burn-corr; } }  // skønnet forbrug for hele dagen
      else burn=g.kt;
    }
    if(burn==null||eat<=0) return {d,v:null,eat,miss:eat<=0,nog:burn==null};
    const adj=Math.round(burn+corr); return {d,v:adj-eat,eat,burn:adj,prelim,low:eat<900};
  });
  return {pts,corr,t};
}

function ebStats(){
  const {pts,t}=ebData();
  const last7=pts.filter(p=>p.d<t).slice(-7).filter(p=>p.v!=null);
  const sum=last7.reduce((a,p)=>a+p.v,0); const td=pts[pts.length-1];
  const s7=last7.length?`<div class="v tnum" style="${sum<0?"color:var(--bad)":""}">${sum<0?"−":""}${num(Math.abs(sum),0)}<small> kcal</small></div><div class="sub">${sum>=0?"≈ "+num(sum/7700,2)+" kg fedt":"overskud ≈ "+num(Math.abs(sum)/7700,2)+" kg"} · ${last7.length} af 7 dage logget</div>`
                       :`<div class="v tnum">—</div><div class="sub">ingen loggede dage</div>`;
  const sT=td.v!=null?`<div class="v tnum" style="${td.v<0?"color:var(--bad)":""}">${td.v<0?"−":""}${num(Math.abs(td.v),0)}<small> kcal</small></div><div class="sub">spist ${num(td.eat,0)} · forbrug ~${num(td.burn,0)}</div>`
                     :`<div class="v tnum">—</div><div class="sub">${td.nog?"afventer aftenens Garmin-synk fra Macen":"log mad for i dag"}</div>`;
  return `<div class="mini-grid" style="margin-top:12px"><div class="mini"><div class="k">Underskud, seneste 7 dage</div>${s7}</div><div class="mini"><div class="k">I dag (foreløbigt)</div>${sT}</div></div>`;
}
function bindEb(container){
  if(!container) return;
  container.querySelectorAll(".ebar").forEach(b=>{
    b.addEventListener("mousemove",e=>showTT(b.dataset.tip,e.clientX,e.clientY));
    b.addEventListener("mouseleave",hideTT);
  });
}
function bindBars(container){
  container.querySelectorAll(".dbar").forEach(b=>{
    b.addEventListener("mousemove",e=>{showTT(`<b>${fmtD(b.dataset.d)}</b> — ${num(b.dataset.v,0)} kcal`,e.clientX,e.clientY);});
    b.addEventListener("mouseleave",hideTT);
  });
}

function weekBounds(){const d=new Date();const day=(d.getDay()+6)%7;const mon=new Date(d);mon.setDate(d.getDate()-day);const sun=new Date(mon);sun.setDate(mon.getDate()+6);
  const iso=x=>x.getFullYear()+"-"+pad(x.getMonth()+1)+"-"+pad(x.getDate());return{from:iso(mon),to:iso(sun)};}
function trainingSummary(){
  const {from,to}=weekBounds();const wk=S.workouts.filter(w=>w.log_date>=from&&w.log_date<=to);
  const runs=wk.filter(w=>w.kind==="loeb");const km=runs.reduce((a,r)=>a+(r.distance_km||0),0);
  const strength=wk.filter(w=>w.kind==="styrke").length;const st=wk.filter(w=>w.kind==="skridt");
  const avg=st.length?Math.round(st.reduce((a,r)=>a+(r.steps||0),0)/st.length):null;
  return {runs:runs.length,km,strength,avg};
}

// ---- render ----
function render(){
  const s=S.settings, st=stats(), t=todayISO();
  const mToday=weighToday("morgen"), aToday=weighToday("foraften"), sToday=weighToday("sengetid");
  const targetToday=malvaegt(t,s.kur_basis_weight);
  const FLOOR=s.ration_floor_g||600;
  const withFloor=x=>Math.max(FLOOR,Math.round(x));

  // hero action — dagsbudget = skønnet forbrug i dag − ønsket underskud
  const B=dayBudget();
  const kcalEaten=sumDay(S.nutrition,t,"calories_in");
  const left=B.budget-kcalEaten;
  let big,sub;
  if(kcalEaten<=0){ big=num(B.budget,0)+" kcal"; sub=`dagens budget · intet logget endnu`; }
  else if(left>=0){ big=num(left,0)+" kcal"; sub=`tilbage af ~${num(B.budget,0)} · spist ${num(kcalEaten,0)}`; }
  else { big=num(-left,0)+" kcal"; sub=kcalEaten<=B.burn?`over budgettet · stadig ~${num(B.burn-kcalEaten,0)} kcal under dit forbrug`:`over dit forbrug på ~${num(B.burn,0)} i dag`; }
  const heroActLabel=kcalEaten>0&&left<0?"Over budgettet":"Tilbage i dag";
  // today totals
  const kcalToday=sumDay(S.nutrition,t,"calories_in");
  const kcalRem=B.budget-kcalToday;
  const kcalPct=Math.min(100,kcalToday/B.budget*100);
  const kcalCol=kcalToday>B.burn?"var(--bad)":kcalToday>B.budget?"var(--warn)":"var(--accent)";
  // blid nedre guardrail: markér hvis kalorier ryger for lavt (<1200)
  const KCAL_FLOOR=1200;
  const kcalLow=kcalToday>0&&kcalToday<KCAL_FLOOR;
  const kcalSub=kcalLow?"under 1.200 · spis lidt mere":(kcalRem>=0?num(kcalRem,0)+" tilbage":num(-kcalRem,0)+" over");
  const kcalSubCol=kcalLow?"var(--warn)":"";
  // snit af de seneste 7 loggede dage (eksklusiv i dag)
  const kByDay={}; S.nutrition.forEach(n=>{ if(n.log_date<t) kByDay[n.log_date]=(kByDay[n.log_date]||0)+(n.calories_in||0); });
  const last7=Object.keys(kByDay).filter(d=>d>=addDays(t,-7)&&kByDay[d]>0).sort();
  const avg7=last7.length?Math.round(last7.reduce((a,d)=>a+kByDay[d],0)/last7.length):null;
  const avgCol=avg7==null?"":avg7>s.calorie_target?"var(--warn)":"var(--accent)";
  const goalPct=((s.start_weight-s.goal_weight)/(s.start_weight-s.kur_basis_weight))*100;
  const planTag=st.vsPlan>=0?`<span class="dot" style="background:var(--good)"></span> ${gram(st.vsPlan*1000)} foran linjen`:`<span class="dot" style="background:var(--warn)"></span> ${gram(-st.vsPlan*1000)} bagud`;
  $("#statusLine").innerHTML=`${planTag} · morgenvægt ${kg(st.cur)} (${fmtD(st.latest.log_date)})`;

  const r4=rateOver(28);
  const rate=r4!=null?sgn(r4)+" kg/uge":"–";
  const rateSub=r4!=null?(r4>=0.4&&r4<=0.7?"på sporet · 4 uger":r4>0.7?"hurtigt · 4 uger":r4>0.05?"langsomt · 4 uger":Math.abs(r4)<=0.05?"flad · 4 uger":"stigende · 4 uger"):"log flere morgenvejninger";

  // kcal map for charts
  const kMap={};
  S.nutrition.forEach(n=>{kMap[n.log_date]=(kMap[n.log_date]||0)+(n.calories_in||0);});
  const tr=trainingSummary();

  $("#app").innerHTML=`
  <section class="hero">
    <div class="hero-now">
      <div class="lbl">Morgenvægt</div>
      <div class="big tnum">${num(st.cur,1)}<span> kg</span></div>
      <div class="delta" style="color:${st.lost>=0?'var(--good)':'var(--bad)'}">${st.lost>=0?'↓ '+kg(st.lost)+' tabt':'↑ '+kg(-st.lost)}</div>
      <div class="progress-wrap">
        <div class="progress-head"><span>${num(s.start_weight,1)} start</span><span>63,5</span></div>
        <div class="bar"><i style="width:${st.pct}%"></i>${(+s.goal_weight<+s.kur_basis_weight-0.05)?`<span class="goalmark" style="left:${goalPct}%" title="mål ${num(s.goal_weight,1)}"></span>`:""}</div>
        <div class="progress-head" style="margin-top:6px"><span>${num(st.pct,0)}% af vejen</span><span>${s.next_phase_goal?"næste fase: "+num(s.next_phase_goal,0)+" kg i det nye år":""}</span></div>
      </div>
    </div>
    <div class="hero-action">
      <div class="lbl">${heroActLabel}</div>
      <div class="action-big tnum">${big}</div>
      <div class="action-sub">${sub}</div>
      <div class="action-meta">
        <div class="m"><div class="k">Forbrug i dag</div><div class="v tnum">~${num(B.burn,0)} kcal</div></div>
        <div class="m"><div class="k">Underskud-mål</div><div class="v tnum">${num(B.deficit,0)} kcal</div></div>
        <div class="m"><div class="k">Morgenvejning</div><div class="v tnum">${mToday?num(mToday.weight_kg,1)+" kg":"—"}</div></div>
      </div>
    </div>
  </section>

  <section class="stats" style="grid-template-columns:repeat(2,1fr)">
    <div class="tile"><div class="k">Snit, seneste 7 dage</div><div class="v tnum">${avg7!=null?num(avg7,0):"—"}<small> kcal</small></div>
      <div class="meter"><i style="width:${avg7?Math.min(100,avg7/s.calorie_target*100):0}%;background:${avgCol}"></i></div>
      <div class="sub">${avg7!=null?last7.length+" af 7 dage logget · mål "+num(s.calorie_target,0):"ingen loggede dage"}</div></div>
    <div class="tile"><div class="k">Kalorier i dag</div><div class="v tnum">${kcalToday}<small> / ~${num(B.budget,0)}</small></div>
      <div class="meter"><i style="width:${kcalPct}%;background:${kcalCol}"></i></div>
      <div class="sub" style="color:${kcalSubCol}">${kcalSub}</div></div>
  </section>
  <section class="stats stats4">
    <div class="tile"><div class="k">Tabt i alt</div><div class="v tnum">${num(st.lost,1)}<small> kg</small></div><div class="sub">siden start</div></div>
    <div class="tile"><div class="k">Til 63,5</div><div class="v tnum">${num(Math.max(0,st.cur-s.kur_basis_weight),1)}<small> kg</small></div><div class="sub">${s.next_phase_goal?"derefter "+num(s.next_phase_goal,0)+" kg i det nye år":""}</div></div>
    <div class="tile"><div class="k">Dage til 18/12</div><div class="v tnum">${st.daysLeft}</div><div class="sub">af ${s.kur_days} kurdage</div></div>
    <div class="tile"><div class="k">Tempo</div><div class="v tnum" style="font-size:20px">${rate}</div><div class="sub">${rateSub}</div></div>
  </section>

  <section class="cards">
    <div class="card">
      <div class="ch"><h2>Vægtudvikling</h2><span class="hint">morgenvægt mod målvægt-linjerne</span></div>
      <div id="wchart">${weightChart()}</div>
      <div class="legend">
        <span style="color:var(--accent-ink)"><i style="background:var(--accent-ink);height:4px"></i>7-dages trend</span>
        <span style="color:var(--accent)"><i style="background:var(--accent);opacity:.55"></i>morgenvægt</span>
        <span style="color:var(--accent-ink)"><i class="dash" style="color:var(--accent-ink)"></i>målvægt 63,5</span>
      </div>
      <div class="plan">${planHtml(st)}</div>
    </div>
  </section>

  <section class="cards c2b">
    <div class="card">
      <div class="ch"><h2>Kalorier</h2><span class="hint">daglige totaler, seneste 3 uger</span></div>
      <div><div class="cap">mod ${s.calorie_target} kcal</div><div id="kchart">${dayBars(kMap,s.calorie_target,"kcal","var(--accent)","var(--amber)","kcal")}</div></div>
    </div>
    <div class="card">
      <div class="ch"><h2>Ugens træning</h2><div style="display:flex;gap:9px;align-items:center"><span class="hint" id="syncNote">${syncStatus}</span><button type="button" id="syncBtn" class="sync-btn">↻ Synk nu</button></div></div>
      <div class="mini-grid">
        <div class="mini"><div class="k">Løbeture</div><div class="v tnum">${tr.runs}<small> / 3</small></div></div>
        <div class="mini"><div class="k">Km løbet</div><div class="v tnum">${num(tr.km,1)}</div></div>
        <div class="mini"><div class="k">Styrke</div><div class="v tnum">${tr.strength}<small> / 1</small></div></div>
        <div class="mini"><div class="k">Ø. skridt</div><div class="v tnum">${tr.avg?tr.avg.toLocaleString("da-DK"):"–"}</div></div>
      </div>
    </div>
  </section>

  <section class="cards"><div class="card">
    <div class="ch"><h2>Energibalance</h2><span class="hint">Garmins forbrug minus det, du har spist · seneste 14 dage</span></div>
    <div id="ebchart">${ebChart()}</div>
    <div class="legend">
      <span style="color:var(--accent)"><i style="background:var(--accent);height:8px"></i>underskud (op)</span>
      <span style="color:var(--bad)"><i style="background:var(--bad);height:8px"></i>overskud (ned)</span>
      <span><i style="background:var(--faint);height:6px;width:6px;border-radius:50%"></i>ikke logget</span>
      <span>Garmin korrigeret ${(S.settings&&S.settings.garmin_kcal_correction!=null)?S.settings.garmin_kcal_correction:-250} kcal/dag · lyse søjler = under 900 kcal logget</span>
    </div>
    ${ebStats()}
  </div></section>

  <section class="cards"><div class="card">
    <div class="ch"><h2>Seneste aktivitet</h2><span class="hint" id="logCount"></span></div>
    <div class="log-list" id="logList"></div>
  </div></section>`;

  bindWeightHover($("#wchart"));
  wireAdj();
  bindBars($("#kchart"));
  bindEb($("#ebchart"));
  bindSync();
  renderLog();
}

async function reloadData(){
  const [wk,wg]=await Promise.all([
    apiGet("workouts","?select=*&order=log_date.desc"),
    apiGet("weighins","?select=*&order=log_date.asc,moment.asc")
  ]);
  S.workouts=wk.map(w=>({...w,distance_km:w.distance_km==null?null:+w.distance_km}));
  S.weighins=wg.map(w=>({...w,weight_kg:+w.weight_kg}));
}
async function runSync(days){
  // henter både træning (intervals) og vægt (withings) — den ene må gerne fejle
  const opt={headers:{apikey:SUPABASE_KEY,Authorization:"Bearer "+SUPABASE_KEY}};
  await Promise.allSettled([
    fetch(FN_URL+"?days="+days,opt).then(r=>r.json()),
    fetch(FN_WEIGH+"?days="+days,opt).then(r=>r.json())
  ]);
}
const nowHM=()=>{const d=new Date();return pad(d.getHours())+":"+pad(d.getMinutes());};
function bindSync(){
  const btn=$("#syncBtn"); if(!btn) return;
  btn.addEventListener("click",async()=>{
    btn.disabled=true; btn.textContent="Synker…";
    try{ await runSync(30); await reloadData(); syncStatus="opdateret "+nowHM(); render(); }
    catch(e){ btn.textContent="↻ Synk nu"; btn.disabled=false; const n=$("#syncNote"); if(n){n.textContent="synk-fejl"; n.style.color="var(--bad)";} }
  });
}
async function backgroundSync(){
  if(bgSynced) return; bgSynced=true;
  try{ await runSync(14); await reloadData(); syncStatus="opdateret "+nowHM(); render(); }catch(e){}
}

function renderLog(){
  const items=[];
  S.weighins.forEach(w=>items.push({date:w.log_date,ord:w.moment==="morgen"?0:w.moment==="foraften"?1:2,html:`<span class="chip w">${MOMENTS[w.moment]}</span> <b>${kg(w.weight_kg)}</b>`}));
  S.nutrition.forEach(n=>{const p=[];if(n.grams!=null)p.push(n.grams+" g");if(n.calories_in!=null)p.push(n.calories_in+" kcal");
    items.push({date:n.log_date,ord:3,html:`<span class="chip c">${n.label||"Mad"}</span> <b>${p.join(" · ")||"—"}</b>`});});
  S.workouts.forEach(w=>{const lab=w.kind==="loeb"?"Løb":w.kind==="styrke"?"Styrke":"Skridt";
    let d=w.kind==="loeb"?`${w.distance_km!=null?num(w.distance_km,1)+" km":""}${w.duration_min?" · "+w.duration_min+" min":""}`:w.kind==="styrke"?"Styrketræning":`${w.steps?w.steps.toLocaleString("da-DK")+" skridt":""}`;
    items.push({date:w.log_date,ord:4,html:`<span class="chip t">${lab}</span> <b>${d||lab}</b>${w.note?` · <span style="color:var(--muted)">${esc(w.note)}</span>`:""}`});});
  items.sort((a,b)=> a.date!==b.date?(a.date<b.date?1:-1):a.ord-b.ord);
  $("#logCount").textContent=items.length+" poster";
  $("#logList").innerHTML=items.slice(0,80).map(it=>`<div class="log-row"><div class="d tnum">${fmtD(it.date)}</div><div class="m">${it.html}</div></div>`).join("")||`<div style="color:var(--muted);padding:16px 4px">Ingen poster endnu.</div>`;
}

// Indlejret som fane? Skjul egen header/footer; temaet styres af forsiden.
const EMBED=(window.self!==window.top);
if(EMBED)document.body.classList.add("embed");
(function(){const root=document.documentElement;let t=null;try{t=localStorage.getItem("vt-theme");}catch(e){}
  if(t&&!EMBED)root.setAttribute("data-theme",t);
  $("#themeBtn").addEventListener("click",()=>{const cur=root.getAttribute("data-theme");
    const sysDark=window.matchMedia&&window.matchMedia("(prefers-color-scheme:dark)").matches;
    const now=cur?cur:(sysDark?"dark":"light");const next=now==="dark"?"light":"dark";
    root.setAttribute("data-theme",next);try{localStorage.setItem("vt-theme",next);}catch(e){}});})();

(async function(){
  try{await loadAll();if(!S.settings)throw new Error("Ingen indstillinger fundet.");render();backgroundSync();}
  catch(err){document.querySelector(".loading")?.remove();const b=$("#errBanner");b.style.display="block";
    b.innerHTML="Kunne ikke hente data fra Supabase.<br><span style='opacity:.8'>"+esc(err.message)+"</span>";
    $("#statusLine").innerHTML='<span class="dot" style="background:var(--bad)"></span> Ingen forbindelse';}
})();

// Videresend touch til den ydre side, så træk-ned-for-at-opdatere også virker
// når vægt-fanen (denne iframe) er åben. Den ydre side afgør selv om siden er i top.
(function(){
  if(window.top===window.self)return; // kun når indlejret
  function fwd(phase,e){
    var t=(e.touches&&e.touches[0])||(e.changedTouches&&e.changedTouches[0]);
    try{parent.postMessage({type:"ptr-touch",phase:phase,y:t?t.clientY:0},"*");}catch(_){}
  }
  window.addEventListener("touchstart",function(e){fwd("touchstart",e);},{passive:true});
  window.addEventListener("touchmove",function(e){fwd("touchmove",e);},{passive:true});
  window.addEventListener("touchend",function(e){fwd("touchend",e);},{passive:true});
})();
</script>
